name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gut-tests:
    name: Headless GUT tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Install GUT
        run: |
          git clone --depth 1 --branch v9.7.1 https://github.com/bitwes/Gut.git _gut_tmp
          mkdir -p addons/gut
          cp -r _gut_tmp/addons/gut/* addons/gut/
          rm -rf _gut_tmp

      - name: Import Godot project
        run: godot --headless --import

      - name: Verify test files exist
        run: |
          if ! compgen -G 'tests/*.gd' > /dev/null; then
            echo "Error: no test files found in tests/"
            exit 1
          fi

      - name: Run GUT tests
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit | tee gut.log
          tests_run=$(awk '$1 == "Tests" {print $2; exit}' gut.log)
          if [ -z "$tests_run" ] || [ "$tests_run" = "none" ] || [ "$tests_run" -eq 0 ]; then
            echo "Error: GUT reported no tests executed (Tests=${tests_run:-empty})"
            exit 1
          fi
          echo "GUT executed $tests_run test(s)"
