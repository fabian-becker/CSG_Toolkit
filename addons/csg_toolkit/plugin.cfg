[plugin]

name="CSG Toolkit - Enhance Your Blockout Speed"
description="Enhance your blockout workflow with the CSG Toolkit. This tool adds quick access buttons to the left toolbar for easy addition of CSG nodes. Hold the action key to add the selected CSG as a child node, and switch operations with number shortcuts. The toolkit also adds CSGRepeater3D and CSGSpreader3D generator nodes for pattern-based repetition and volume/surface scattering, with live preview, debounced auto-refresh, freeze-to-mesh performance mode and non-destructive baking."
author="LuckyTepot"
version="1.8.0"
script="csg_toolkit.gd"
